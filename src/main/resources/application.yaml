server:
  port: 8080
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/gestion_ressource
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: false
    database: mysql
    database-platform: org.hibernate.dialect.MySQL8Dialect
application:
  security:
    jwt:
      secret-key: 
      expiration: 86400000 # a day
      refresh-token:
        expiration: 604800000 # 7 days
